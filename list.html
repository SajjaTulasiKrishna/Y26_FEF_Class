<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <!-- ordered list -->
     ###ordered list###
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
    <!-- unordered list -->
     ###unordered list###
     <ul style="list-style-type: disc;">
        <li>Python</li>
        <li>Java</li>
        <li>C++</li>
    </ul>
<!-- description list  -->
     ###description list###
    <dl>
    <dt>HTML</dt>
    <dd>HyperText Markup Language</dd>
    <dt>CSS</dt>
    <dd>Cascading Style Sheets</dd>
    </dl>

    <!-- Nested list -->
     ###Nested list###
<ul>
    <li>Frontend
        <ol>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ol>
    </li>
    <li>Backend</li>
</ul>

</body>
</html>
