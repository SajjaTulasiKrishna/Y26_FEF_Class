<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h2>HTML Table Tags Example</h2>

    <table border="1">

        <caption>Student Marks Details</caption>

    <colgroup>
        <col style="background-color: lightblue;">
        <col style="background-color: lightgreen">
        <col style="background-color: lightpink;">
    </colgroup>

        <thead>
            <tr>
                <th>Student Name</th>
                <th>Subject</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="2" style="padding: 20px;">Ravi</td>
                <td>HTML</td>
                <td>85</td>
            </tr>

            <tr>
                
                <td>CSS</td>
                <td>90</td>
            </tr>

            <tr>
                <td rowspan="2">Priya</td>
                <td>HTML</td>
                <td>92</td>
            </tr>

            <tr>
                 
                <td>CSS</td>
                <td>88</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2" >Total Students</th>
                
                <td>2</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
